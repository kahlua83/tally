<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VEDC Caster Signal System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .transition-bg { transition: background-color 0.25s ease, color 0.25s ease; }
        @keyframes pulse-fast {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
        .animate-pulse-fast { animation: pulse-fast 0.8s infinite; }
        @keyframes pop-in {
            0% { transform: scale(0.5); opacity: 0; }
            70% { transform: scale(1.1); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }
        .animate-pop { animation: pop-in 0.3s ease-out forwards; }
    </style>
</head>
<body class="bg-slate-950 text-white h-screen flex flex-col justify-between overflow-hidden font-sans">

    <!-- ==================== KHU VỰC HIỂN THỊ CHO CASTER (TABLET) ==================== -->
    <div id="caster-view" class="hidden flex-1 flex flex-col justify-center items-center p-6 text-center transition-bg bg-slate-950 relative">
        <!-- Đèn Tally Trạng Thái Chính -->
        <div id="status-badge" class="text-5xl md:text-8xl font-black uppercase tracking-wider mb-6 px-10 py-6 rounded-3xl bg-black/40 shadow-2xl border-4 border-white/20">
            CONNECTING...
        </div>
        <div id="status-subtext" class="text-2xl md:text-4xl font-bold tracking-wide uppercase opacity-90 mb-8">
            Đang kết nối...
        </div>

        <!-- Chú ý lời nhắc từ Đạo diễn -->
        <div id="custom-msg" class="text-3xl md:text-5xl font-extrabold max-w-5xl text-amber-300 bg-black/70 border-4 border-amber-400 px-8 py-6 rounded-2xl shadow-2xl hidden animate-pulse-fast">
        </div>

        <!-- Lớp phủ Đếm ngược (Countdown Overlay) -->
        <div id="countdown-overlay" class="absolute inset-0 bg-black/95 z-50 flex flex-col justify-center items-center hidden">
            <div class="text-xl md:text-3xl font-bold text-amber-400 tracking-widest uppercase mb-4">CHUẨN BỊ CHUYỂN TRẠNG THÁI</div>
            <div id="countdown-number" class="text-9xl md:text-[14rem] font-black text-white animate-pop">5</div>
        </div>
    </div>

    <!-- ==================== KHU VỰC ĐIỀU KHIỂN CHO ĐẠO DIỄN (PC) ==================== -->
    <div id="director-view" class="hidden flex-1 p-6 overflow-y-auto max-w-7xl mx-auto w-full">
        <div class="flex justify-between items-center mb-6 pb-4 border-b border-slate-800">
            <h1 class="text-3xl font-black text-indigo-400 flex items-center gap-3">
                <span>🎛️ BẢNG ĐIỀU KHIỂN TALLY CASTER (VEDC)</span>
            </h1>
            <span class="bg-indigo-950 text-indigo-300 border border-indigo-700/50 px-4 py-1.5 rounded-full text-xs font-bold uppercase tracking-wider">
                ⚡ Realtime Dual-Panel Mode + Countdown
            </span>
        </div>

        <!-- Chia 2 cột riêng biệt cho Bàn 1 & Bàn 2 -->
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">

            <!-- ================= BÀN 1 (MAIN CASTER) ================= -->
            <div class="bg-slate-900 border-2 border-slate-800 rounded-3xl p-6 shadow-xl flex flex-col justify-between">
                <div>
                    <div class="flex justify-between items-center mb-4">
                        <h2 class="text-2xl font-bold text-slate-100 flex items-center gap-2">
                            <span>🎙️ BÀN 1</span> <span class="text-xs bg-slate-800 text-slate-400 px-2.5 py-1 rounded-md">MAIN</span>
                        </h2>
                        <!-- Màn hình trạng thái thu nhỏ -->
                        <div id="monitor-c1" class="px-4 py-2 rounded-xl text-sm font-black uppercase bg-slate-800 text-slate-400 border border-slate-700 transition-bg">
                            STANDBY
                        </div>
                    </div>

                    <!-- Lưới các nút bấm Bàn 1 -->
                    <div class="grid grid-cols-2 gap-3 mb-4">
                        <button id="btn-c1-onair" class="p-4 rounded-2xl bg-red-600 hover:bg-red-500 font-black text-lg shadow-lg transition active:scale-95 text-left flex flex-col">
                            <span>🔴 ON AIR</span>
                            <span class="text-xs font-normal opacity-80">LÊN SÓNG</span>
                        </button>

                        <button id="btn-c1-standby" class="p-4 rounded-2xl bg-emerald-600 hover:bg-emerald-500 font-black text-lg shadow-lg transition active:scale-95 text-left flex flex-col">
                            <span>🟢 PREVIEW</span>
                            <span class="text-xs font-normal opacity-80">STANDBY / CHUẨN BỊ</span>
                        </button>

                        <button id="btn-c1-caugio" class="p-4 rounded-2xl bg-amber-500 hover:bg-amber-400 text-slate-950 font-black text-lg shadow-lg transition active:scale-95 text-left flex flex-col">
                            <span>🟡 CÂU GIỜ</span>
                            <span class="text-xs font-normal opacity-80">HOLD TIME</span>
                        </button>

                        <button id="btn-c1-out" class="p-4 rounded-2xl bg-blue-600 hover:bg-blue-500 font-black text-lg shadow-lg transition active:scale-95 text-left flex flex-col">
                            <span>🔵 CASTER OUT</span>
                            <span class="text-xs font-normal opacity-80">BÌNH LUẬN XONG</span>
                        </button>

                        <button id="btn-c1-break" class="p-4 rounded-2xl bg-purple-600 hover:bg-purple-500 font-black text-lg shadow-lg transition active:scale-95 text-left flex flex-col col-span-2">
                            <span>🟣 BREAK</span>
                            <span class="text-xs font-normal opacity-80">NGHỈ GIẢI LAO</span>
                        </button>
                    </div>
                </div>

                <!-- Lời nhắc nhanh Bàn 1 -->
                <div class="bg-slate-950/60 p-4 rounded-2xl border border-slate-800">
                    <label class="block text-xs font-bold uppercase mb-2 text-amber-400">⚠️ Chú ý lời nhắc (Bàn 1):</label>
                    <div class="flex gap-2">
                        <input type="text" id="input-c1-msg" placeholder="Gõ lời nhắc khẩn cấp..." class="flex-1 bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-2 text-sm text-white focus:outline-none focus:border-amber-500">
                        <button id="btn-c1-sendmsg" class="bg-amber-500 hover:bg-amber-400 text-slate-950 px-4 py-2 rounded-xl text-xs font-black transition">GỬI</button>
                        <button id="btn-c1-clearmsg" class="bg-slate-800 hover:bg-slate-700 px-3 py-2 rounded-xl text-xs font-bold text-slate-400 transition">XÓA</button>
                    </div>
                </div>
            </div>

            <!-- ================= BÀN 2 (ANALYST / DESK) ================= -->
            <div class="bg-slate-900 border-2 border-slate-800 rounded-3xl p-6 shadow-xl flex flex-col justify-between">
                <div>
                    <div class="flex justify-between items-center mb-4">
                        <h2 class="text-2xl font-bold text-slate-100 flex items-center gap-2">
                            <span>🎧 BÀN 2</span> <span class="text-xs bg-slate-800 text-slate-400 px-2.5 py-1 rounded-md">ANALYST</span>
                        </h2>
                        <!-- Màn hình trạng thái thu nhỏ -->
                        <div id="monitor-c2" class="px-4 py-2 rounded-xl text-sm font-black uppercase bg-slate-800 text-slate-400 border border-slate-700 transition-bg">
                            STANDBY
                        </div>
                    </div>

                    <!-- Lưới các nút bấm Bàn 2 -->
                    <div class="grid grid-cols-2 gap-3 mb-4">
                        <button id="btn-c2-onair" class="p-4 rounded-2xl bg-red-600 hover:bg-red-500 font-black text-lg shadow-lg transition active:scale-95 text-left flex flex-col">
                            <span>🔴 ON AIR</span>
                            <span class="text-xs font-normal opacity-80">LÊN SÓNG</span>
                        </button>

                        <button id="btn-c2-standby" class="p-4 rounded-2xl bg-emerald-600 hover:bg-emerald-500 font-black text-lg shadow-lg transition active:scale-95 text-left flex flex-col">
                            <span>🟢 PREVIEW</span>
                            <span class="text-xs font-normal opacity-80">STANDBY / CHUẨN BỊ</span>
                        </button>

                        <button id="btn-c2-caugio" class="p-4 rounded-2xl bg-amber-500 hover:bg-amber-400 text-slate-950 font-black text-lg shadow-lg transition active:scale-95 text-left flex flex-col">
                            <span>🟡 CÂU GIỜ</span>
                            <span class="text-xs font-normal opacity-80">HOLD TIME</span>
                        </button>

                        <button id="btn-c2-out" class="p-4 rounded-2xl bg-blue-600 hover:bg-blue-500 font-black text-lg shadow-lg transition active:scale-95 text-left flex flex-col">
                            <span>🔵 CASTER OUT</span>
                            <span class="text-xs font-normal opacity-80">BÌNH LUẬN XONG</span>
                        </button>

                        <button id="btn-c2-break" class="p-4 rounded-2xl bg-purple-600 hover:bg-purple-500 font-black text-lg shadow-lg transition active:scale-95 text-left flex flex-col col-span-2">
                            <span>🟣 BREAK</span>
                            <span class="text-xs font-normal opacity-80">NGHỈ GIẢI LAO</span>
                        </button>
                    </div>
                </div>

                <!-- Lời nhắc nhanh Bàn 2 -->
                <div class="bg-slate-950/60 p-4 rounded-2xl border border-slate-800">
                    <label class="block text-xs font-bold uppercase mb-2 text-amber-400">⚠️ Chú ý lời nhắc (Bàn 2):</label>
                    <div class="flex gap-2">
                        <input type="text" id="input-c2-msg" placeholder="Gõ lời nhắc khẩn cấp..." class="flex-1 bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-2 text-sm text-white focus:outline-none focus:border-amber-500">
                        <button id="btn-c2-sendmsg" class="bg-amber-500 hover:bg-amber-400 text-slate-950 px-4 py-2 rounded-xl text-xs font-black transition">GỬI</button>
                        <button id="btn-c2-clearmsg" class="bg-slate-800 hover:bg-slate-700 px-3 py-2 rounded-xl text-xs font-bold text-slate-400 transition">XÓA</button>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <!-- SCRIPT TÍCH HỢP FIREBASE -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDJZo-qh1VsbaixImBQOWTc5g1KLY4ugvc",
            authDomain: "vedc-tally-signal-1470d.firebaseapp.com",
            databaseURL: "https://vedc-tally-signal-1470d-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "vedc-tally-signal-1470d",
            storageBucket: "vedc-tally-signal-1470d.firebasestorage.app",
            messagingSenderId: "208327260119",
            appId: "1:208327260119:web:dc063b12622626472efd92",
            measurementId: "G-KXC2301E50"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const urlParams = new URLSearchParams(window.location.search);
        const role = urlParams.get('role') || 'director';
        const casterId = urlParams.get('id') || 'caster_1';

        if (role === 'director') {
            document.getElementById('director-view').classList.remove('hidden');
            initDirectorPanel();
        } else {
            document.getElementById('caster-view').classList.remove('hidden');
            initCasterTablet(casterId);
        }

        // --- ĐẠO DIỄN: Gán sự kiện trực tiếp cho Bàn 1 & Bàn 2 ---
        function initDirectorPanel() {
            // Sự kiện Bàn 1
            document.getElementById('btn-c1-onair').onclick = () => sendSignal('caster_1', 'ON AIR', 'LÊN SÓNG', 'bg-red-600', 'text-white');
            document.getElementById('btn-c1-standby').onclick = () => sendSignal('caster_1', 'PREVIEW', 'STANDBY / CHUẨN BỊ', 'bg-emerald-600', 'text-white');
            document.getElementById('btn-c1-caugio').onclick = () => sendSignal('caster_1', 'CÂU GIỜ', 'HOLD TIME', 'bg-amber-500', 'text-slate-950');
            document.getElementById('btn-c1-out').onclick = () => sendSignal('caster_1', 'CASTER OUT', 'BÌNH LUẬN XONG', 'bg-blue-600', 'text-white');
            document.getElementById('btn-c1-break').onclick = () => sendSignal('caster_1', 'BREAK', 'NGHỈ GIẢI LAO', 'bg-purple-600', 'text-white');
            document.getElementById('btn-c1-sendmsg').onclick = () => sendQuickMsg('caster_1', 'input-c1-msg');
            document.getElementById('btn-c1-clearmsg').onclick = () => clearQuickMsg('caster_1');

            // Sự kiện Bàn 2
            document.getElementById('btn-c2-onair').onclick = () => sendSignal('caster_2', 'ON AIR', 'LÊN SÓNG', 'bg-red-600', 'text-white');
            document.getElementById('btn-c2-standby').onclick = () => sendSignal('caster_2', 'PREVIEW', 'STANDBY / CHUẨN BỊ', 'bg-emerald-600', 'text-white');
            document.getElementById('btn-c2-caugio').onclick = () => sendSignal('caster_2', 'CÂU GIỜ', 'HOLD TIME', 'bg-amber-500', 'text-slate-950');
            document.getElementById('btn-c2-out').onclick = () => sendSignal('caster_2', 'CASTER OUT', 'BÌNH LUẬN XONG', 'bg-blue-600', 'text-white');
            document.getElementById('btn-c2-break').onclick = () => sendSignal('caster_2', 'BREAK', 'NGHỈ GIẢI LAO', 'bg-purple-600', 'text-white');
            document.getElementById('btn-c2-sendmsg').onclick = () => sendQuickMsg('caster_2', 'input-c2-msg');
            document.getElementById('btn-c2-clearmsg').onclick = () => clearQuickMsg('caster_2');

            // Lắng nghe trạng thái để cập nhật Đèn Monitor nhỏ trên bàn đạo diễn
            listenMonitor('caster_1', 'monitor-c1');
            listenMonitor('caster_2', 'monitor-c2');
        }

        function sendSignal(targetId, titleEng, titleVie, bgClass, textClass) {
            // Thêm một trường timestamp (thời gian bấm) để kích hoạt hiệu ứng đếm ngược bên phía máy tính bảng
            set(ref(db, 'signals/' + targetId), {
                titleEng: titleEng,
                titleVie: titleVie,
                bgClass: bgClass,
                textClass: textClass,
                message: '',
                triggerTime: Date.now()
            }).catch(err => alert("Lỗi: " + err.message));
        }

        function sendQuickMsg(targetId, inputId) {
            const input = document.getElementById(inputId);
            const msg = input.value.trim();
            if(!msg) return;

            const targetRef = ref(db, 'signals/' + targetId);
            onValue(targetRef, (snapshot) => {
                const data = snapshot.val() || {};
                set(targetRef, { ...data, message: msg });
            }, { onlyOnce: true });
            input.value = '';
        }

        function clearQuickMsg(targetId) {
            const targetRef = ref(db, 'signals/' + targetId);
            onValue(targetRef, (snapshot) => {
                const data = snapshot.val() || {};
                set(targetRef, { ...data, message: '' });
            }, { onlyOnce: true });
        }

        function listenMonitor(targetId, elementId) {
            const monitorEl = document.getElementById(elementId);
            onValue(ref(db, 'signals/' + targetId), (snapshot) => {
                const data = snapshot.val();
                if (data) {
                    monitorEl.innerText = data.titleEng + ' (' + data.titleVie + ')';
                    monitorEl.className = `px-4 py-2 rounded-xl text-xs font-black uppercase shadow ${data.bgClass} ${data.textClass}`;
                }
            });
        }

        // --- CASTER TABLET: Hiển thị tín hiệu siêu to & Hiệu ứng Đếm ngược 5s ---
        let lastTriggerTime = 0;

        function initCasterTablet(targetId) {
            const bodyBg = document.getElementById('caster-view');
            const statusBadge = document.getElementById('status-badge');
            const statusSubtext = document.getElementById('status-subtext');
            const customMsg = document.getElementById('custom-msg');
            const countdownOverlay = document.getElementById('countdown-overlay');
            const countdownNumber = document.getElementById('countdown-number');

            onValue(ref(db, 'signals/' + targetId), (snapshot) => {
                const data = snapshot.val();
                if (!data) return;

                // Kiểm tra nếu có tín hiệu thay đổi mới từ đạo diễn (triggerTime thay đổi)
                if (data.triggerTime && data.triggerTime !== lastTriggerTime) {
                    lastTriggerTime = data.triggerTime;
                    
                    // Kích hoạt đếm ngược 5 giây
                    runCountdown(5, () => {
                        applyStatus(data, bodyBg, statusBadge, statusSubtext, customMsg);
                    });
                } else {
                    // Cập nhật thông thường (ví dụ lúc mới load trang hoặc cập nhật tin nhắn)
                    applyStatus(data, bodyBg, statusBadge, statusSubtext, customMsg);
                }
            });

            function runCountdown(seconds, callback) {
                countdownOverlay.classList.remove('hidden');
                let currentSec = seconds;
                countdownNumber.innerText = currentSec;

                const timer = setInterval(() => {
                    currentSec--;
                    if (currentSec > 0) {
                        countdownNumber.innerText = currentSec;
                        // Khởi động lại animation pop để số nhảy mượt
                        countdownNumber.classList.remove('animate-pop');
                        void countdownNumber.offsetWidth;
                        countdownNumber.classList.add('animate-pop');
                    } else {
                        clearInterval(timer);
                        countdownOverlay.classList.add('hidden');
                        if (callback) callback();
                    }
                }, 1000);
            }
        }

        function applyStatus(data, bodyBg, statusBadge, statusSubtext, customMsg) {
            bodyBg.className = "flex-1 flex flex-col justify-center items-center p-6 text-center transition-bg ";
            bodyBg.classList.et ? bodyBg.classList.add(data.bgClass || 'bg-slate-950') : bodyBg.className += ' ' + (data.bgClass || 'bg-slate-950');
            bodyBg.classList.add(data.textClass || 'text-white');
            
            statusBadge.innerText = data.titleEng || 'STANDBY';
            statusSubtext.innerText = data.titleVie || 'SẴN SÀNG';

            if (data.message && data.message.trim() !== '') {
                customMsg.innerText = `⚠️ LỜI NHẮC: ${data.message}`;
                customMsg.classList.remove('hidden');
            } else {
                customMsg.classList.add('hidden');
            }
        }
    </script>
</body>
</html>
