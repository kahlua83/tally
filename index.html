<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">

    <style>
        @keyframes pulse-fast {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
        .animate-pulse-fast { animation: pulse-fast 0.8s infinite; }

        .responsive-title {
            font-size: clamp(2rem, 6vw, 5rem);
            line-height: 1.1;
        }
        .responsive-subtext {
            font-size: clamp(1rem, 3vw, 2rem);
            line-height: 1.2;
        }
        .responsive-msg {
            font-size: clamp(1.1rem, 3.5vw, 2.5rem);
            line-height: 1.3;
        }
        .responsive-countdown {
            font-size: clamp(1.1rem, 3.5vw, 2rem);
        }
    </style>
</head>
<body id="main-body" class="bg-slate-950 text-white h-screen w-screen flex flex-col justify-between overflow-x-hidden font-sans select-none" style="background-color: #020617; transition: background-color 0.2s ease;">

    <!-- ==================== BƯỚC CÀI ĐẶT BAN ĐẦU ==================== -->

            <h1 class="text-2xl sm:text-3xl font-black text-indigo-400 mb-2 flex items-center justify-center gap-2">

            <p id="setup-step-title" class="text-slate-400 text-xs sm:text-sm mb-6">Bước 1: Chọn vai trò truy cập hệ thống</p>

            <!-- BƯỚC 1: CHỌN VAI TRÒ -->
            <div id="step-role-container" class="space-y-3 mb-4">
                <button onclick="selectRole('director')" class="w-full py-4 px-4 bg-indigo-600 hover:bg-indigo-500 font-black text-base rounded-2xl transition flex items-center justify-center gap-2 shadow-lg">
                    <span>🎛️ ĐẠO DIỄN (DIRECTOR)</span>
                </button>
                <button onclick="selectRole('caster')" class="w-full py-4 px-4 bg-teal-600 hover:bg-teal-500 font-black text-base rounded-2xl transition flex items-center justify-center gap-2 shadow-lg">
                    <span>📺 MÀN HÌNH CASTER (SCREEN)</span>
                </button>
            </div>

            <!-- BƯỚC 2: CHỌN JOB -->
            <div id="step-job-container" class="space-y-3 mb-6 hidden">
                <button onclick="selectPresetJob('job1')" class="w-full py-3.5 px-4 bg-indigo-600 hover:bg-indigo-500 font-bold rounded-xl transition flex items-center justify-between text-sm sm:text-base">
                    <span>📡 JOB 1 (Sự kiện 1)</span>
                    <span class="text-xs bg-indigo-900 px-2 py-1 rounded">job1</span>
                </button>
                <button onclick="selectPresetJob('job2')" class="w-full py-3.5 px-4 bg-emerald-600 hover:bg-emerald-500 font-bold rounded-xl transition flex items-center justify-between text-sm sm:text-base">
                    <span>🎧 JOB 2 (Sự kiện 2)</span>
                    <span class="text-xs bg-emerald-900 px-2 py-1 rounded">job2</span>
                </button>
                <button onclick="selectPresetJob('job3')" class="w-full py-3.5 px-4 bg-purple-600 hover:bg-purple-500 font-bold rounded-xl transition flex items-center justify-between text-sm sm:text-base">

                    <span class="text-xs bg-purple-900 px-2 py-1 rounded">job3</span>

    <!-- SCRIPT TÍCH HỢP SUPABASE -->
    <script type="module">
        const SUPABASE_URL = 'https://omwirirvygtlmvcjrlik.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_zfhPOosE4n_efrG_egojpg_WY7ryv7R';

        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const urlParams = new URLSearchParams(window.location.search);
        let role = urlParams.get('role');
        let casterId = urlParams.get('id');
        let jobId = urlParams.get('job');

        function cleanJobId(id) {
            if (!id) return '';
            return id.trim().toLowerCase().replace(/\s+/g, '-').replace(/[^a-z0-9-_]/g, '');
        }

        if (jobId) jobId = cleanJobId(jobId);

        const setupView = document.getElementById('setup-view');
        const stepRoleContainer = document.getElementById('step-role-container');
        const stepJobContainer = document.getElementById('step-job-container');
        const stepCasterDeskContainer = document.getElementById('step-caster-desk-container');
        const setupStepTitle = document.getElementById('setup-step-title');

        if (!role) {
            setupView.classList.remove('hidden');
            stepRoleContainer.classList.remove('hidden');
            stepJobContainer.classList.add('hidden');
            stepCasterDeskContainer.classList.add('hidden');
            setupStepTitle.innerText = "Bước 1: Chọn vai trò truy cập hệ thống";
        } else if (!jobId) {
            setupView.classList.remove('hidden');
            stepRoleContainer.classList.add('hidden');
            stepJobContainer.classList.remove('hidden');
            stepCasterDeskContainer.classList.add('hidden');
            setupStepTitle.innerText = `Bước 2: Chọn Job cho (${role === 'director' ? 'Đạo diễn' : 'Màn hình Caster'})`;
        } else if (role === 'caster' && !casterId) {
            setupView.classList.remove('hidden');
            stepRoleContainer.classList.add('hidden');
            stepJobContainer.classList.add('hidden');
            stepCasterDeskContainer.classList.remove('hidden');
            setupStepTitle.innerText = `Bước 3: Chọn Bàn (Job: ${jobId})`;
        } else {
            startApp();
        }

        window.selectRole = function(selectedRole) {
            urlParams.set('role', selectedRole);
            window.location.search = urlParams.toString();
        };

        window.selectPresetJob = function(jobName) {
            urlParams.set('job', cleanJobId(jobName));
            window.location.search = urlParams.toString();
        };

        document.getElementById('btn-custom-job').onclick = () => {
            const val = document.getElementById('custom-job-input').value.trim();
            if (val) window.selectPresetJob(val);
        };

        window.selectCasterDesk = function(selectedDeskId) {
            urlParams.set('id', selectedDeskId);
            window.location.search = urlParams.toString();
        };

        window.backToRoleStep = function() {
            urlParams.delete('role');
            window.location.search = urlParams.toString();
        };

        window.backToJobStep = function() {
            urlParams.delete('job');
            window.location.search = urlParams.toString();
        };

        window.resetSetup = function() {
            window.location.href = window.location.pathname;
        };

        document.getElementById('btn-change-job').onclick = resetSetup;
        document.getElementById('btn-caster-reset').onclick = resetSetup;

        function startApp() {
            setupView.classList.add('hidden');

            if (role === 'director') {
                document.getElementById('director-view').classList.remove('hidden');
                document.getElementById('job-badge').innerText = '🏷️ Job: ' + jobId;
                initDirectorPanel();
            } else {
                document.getElementById('caster-view').classList.remove('hidden');
                
                const deskBadge = document.getElementById('caster-desk-badge');
                if (casterId === 'caster_1') {
                    deskBadge.innerText = `🎙️ ${jobId.toUpperCase()} - BÀN 1 (MAIN CASTER)`;
                } else if (casterId === 'caster_2') {
                    deskBadge.innerText = `🎧 ${jobId.toUpperCase()} - BÀN 2 (ANALYST DESK)`;
                } else {
                    deskBadge.innerText = `📡 ${jobId.toUpperCase()} - ${casterId}`;
                }

                initCasterTablet(casterId);
                requestWakeLock();
            }
        }

        function getChannelName(targetCaster) {
            return `job_${jobId}_${targetCaster}`;
        }

        function initDirectorPanel() {
            // Bàn 1
            document.getElementById('btn-c1-onair').onclick = () => sendSignal('caster_1', 'STREAM ON AIR', 'LUỒNG SÓNG ĐANG PHÁT', '#b91c1c', '#ffffff', 'input-c1-sec');
            document.getElementById('btn-c1-cam-on').onclick = () => sendSignal('caster_1', 'CASTER LÊN HÌNH', 'ON CAMERA', '#dc2626', '#ffffff', 'input-c1-sec');
            document.getElementById('btn-c1-cam-off').onclick = () => sendSignal('caster_1', 'CASTER XUỐNG HÌNH', 'OFF CAM (VẪN BÌNH LUẬN)', '#000000', '#ffffff', 'input-c1-sec');
            document.getElementById('btn-c1-standby').onclick = () => sendSignal('caster_1', 'PREVIEW', 'STANDBY / CHUẨN BỊ', '#059669', '#ffffff', 'input-c1-sec');
            document.getElementById('btn-c1-caugio').onclick = () => sendSignal('caster_1', 'CÂU GIỜ', 'HOLD TIME', '#f59e0b', '#030712', 'input-c1-sec');
            document.getElementById('btn-c1-mc').onclick = () => sendSignal('caster_1', 'CHUYỂN VỀ MC', 'BACK TO HOST / MC', '#0d9488', '#ffffff', 'input-c1-sec');
            document.getElementById('btn-c1-out').onclick = () => sendSignal('caster_1', 'CASTER OUT', 'BÌNH LUẬN XONG', '#2563eb', '#ffffff', 'input-c1-sec');
            document.getElementById('btn-c1-break').onclick = () => sendSignal('caster_1', 'BREAK', 'NGHỈ GIẢI LAO', '#9333ea', '#ffffff', 'input-c1-sec');
            document.getElementById('btn-c1-sendmsg').onclick = () => sendQuickMsg('caster_1', 'input-c1-msg');
            document.getElementById('btn-c1-clearmsg').onclick = () => clearQuickMsg('caster_1');

            // Bàn 2
            document.getElementById('btn-c2-onair').onclick = () => sendSignal('caster_2', 'STREAM ON AIR', 'LUỒNG SÓNG ĐANG PHÁT', '#b91c1c', '#ffffff', 'input-c2-sec');
            document.getElementById('btn-c2-cam-on').onclick = () => sendSignal('caster_2', 'CASTER LÊN HÌNH', 'ON CAMERA', '#dc2626', '#ffffff', 'input-c2-sec');
            document.getElementById('btn-c2-cam-off').onclick = () => sendSignal('caster_2', 'CASTER XUỐNG HÌNH', 'OFF CAM (VẪN BÌNH LUẬN)', '#000000', '#ffffff', 'input-c2-sec');
            document.getElementById('btn-c2-standby').onclick = () => sendSignal('caster_2', 'PREVIEW', 'STANDBY / CHUẨN BỊ', '#059669', '#ffffff', 'input-c2-sec');
            document.getElementById('btn-c2-caugio').onclick = () => sendSignal('caster_2', 'CÂU GIỜ', 'HOLD TIME', '#f59e0b', '#030712', 'input-c2-sec');
            document.getElementById('btn-c2-mc').onclick = () => sendSignal('caster_2', 'CHUYỂN VỀ MC', 'BACK TO HOST / MC', '#0d9488', '#ffffff', 'input-c2-sec');
            document.getElementById('btn-c2-out').onclick = () => sendSignal('caster_2', 'CASTER OUT', 'BÌNH LUẬN XONG', '#2563eb', '#ffffff', 'input-c2-sec');
            document.getElementById('btn-c2-break').onclick = () => sendSignal('caster_2', 'BREAK', 'NGHỈ GIẢI LAO', '#9333ea', '#ffffff', 'input-c2-sec');
            document.getElementById('btn-c2-sendmsg').onclick = () => sendQuickMsg('caster_2', 'input-c2-msg');
            document.getElementById('btn-c2-clearmsg').onclick = () => clearQuickMsg('caster_2');

            listenMonitor('caster_1', 'monitor-c1');
            listenMonitor('caster_2', 'monitor-c2');
        }

        let directorStateC1 = { message: '' };
        let directorStateC2 = { message: '' };

        function sendSignal(targetId, titleEng, titleVie, bgColor, textColor, secInputId) {
            const countdownSec = parseInt(document.getElementById(secInputId).value) || 0;
            const payload = {
                titleEng,
                titleVie,
                bgColor,
                textColor,
                message: targetId === 'caster_1' ? directorStateC1.message : directorStateC2.message,
                countdownSec,
                triggerTime: Date.now()
            };

            const channel = supabaseClient.channel(getChannelName(targetId));
            channel.subscribe(async (status) => {
                if (status === 'SUBSCRIBED') {
                    await channel.send({
                        type: 'broadcast',
                        event: 'signal',
                        payload: payload
                    });
                    supabaseClient.removeChannel(channel);
                }
            });
        }

        function sendQuickMsg(targetId, inputId) {
            const input = document.getElementById(inputId);
            const msg = input.value.trim();
            if(!msg) return;

            if (targetId === 'caster_1') directorStateC1.message = msg;
            else directorStateC2.message = msg;
            
            const channel = supabaseClient.channel(getChannelName(targetId));
            channel.subscribe(async (status) => {
                if (status === 'SUBSCRIBED') {
                    await channel.send({
                        type: 'broadcast',
                        event: 'signal',
                        payload: {
                            message: msg,
                            triggerTime: Date.now()
                        }
                    });
                    supabaseClient.removeChannel(channel);
                }
            });
            input.value = '';
        }

        function clearQuickMsg(targetId) {
            if (targetId === 'caster_1') directorStateC1.message = '';
            else directorStateC2.message = '';

            const channel = supabaseClient.channel(getChannelName(targetId));
            channel.subscribe(async (status) => {
                if (status === 'SUBSCRIBED') {
                    await channel.send({
                        type: 'broadcast',
                        event: 'signal',
                        payload: {
                            message: '',
                            triggerTime: Date.now()
                        }
                    });
                    supabaseClient.removeChannel(channel);
                }
            });
        }

        function listenMonitor(targetId, elementId) {
            const monitorEl = document.getElementById(elementId);
            const channel = supabaseClient.channel(getChannelName(targetId));
            channel.on('broadcast', { event: 'signal' }, (payload) => {
                const data = payload.payload;
                if (data && data.titleEng) {
                    monitorEl.innerText = data.titleEng + ' (' + data.titleVie + ')';
                    monitorEl.style.backgroundColor = data.bgColor || '#1e293b';
                    monitorEl.style.color = data.textColor || '#ffffff';
                }
            }).subscribe();
        }

        let lastTriggerTime = 0;
        let activeTimer = null;

        function initCasterTablet(targetId) {
            const mainBody = document.getElementById('main-body');
            const statusBadge = document.getElementById('status-badge');
            const statusSubtext = document.getElementById('status-subtext');
            const customMsg = document.getElementById('custom-msg');
            const countdownBanner = document.getElementById('caster-countdown-banner');
            const timerNum = document.getElementById('caster-timer-num');

            const channel = supabaseClient.channel(getChannelName(targetId));
            channel.on('broadcast', { event: 'signal' }, (payload) => {
                const data = payload.payload;
                if (!data) return;

                if (data.bgColor) {
                    mainBody.style.backgroundColor = data.bgColor;
                    mainBody.style.color = data.textColor || '#ffffff';
                    statusBadge.innerText = data.titleEng || 'STANDBY';
                    statusSubtext.innerText = data.titleVie || 'SẴN SÀNG';
                }

                if (data.message !== undefined) {
                    if (data.message && data.message.trim() !== '') {
                        customMsg.innerText = `⚠️ LỜI NHẮC: ${data.message}`;
                        customMsg.classList.remove('hidden');
                    } else {
                        customMsg.classList.add('hidden');
                    }
                }

                if (data.triggerTime && data.triggerTime !== lastTriggerTime) {
                    lastTriggerTime = data.triggerTime;

                    if (activeTimer) clearInterval(activeTimer);

                    if (data.countdownSec && data.countdownSec > 0) {
                        let remainingSec = data.countdownSec;
                        countdownBanner.classList.remove('hidden');
                        timerNum.innerText = remainingSec;

                        activeTimer = setInterval(() => {
                            remainingSec--;
                            if (remainingSec > 0) {
                                timerNum.innerText = remainingSec;
                            } else {
                                clearInterval(activeTimer);
                                countdownBanner.classList.add('hidden');
                            }
                        }, 1000);
                    } else {
                        countdownBanner.classList.add('hidden');
                    }
                }
            }).subscribe();
        }

        let wakeLock = null;
        async function requestWakeLock() {
            const statusEl = document.getElementById('wake-lock-status');
            try {
                if ('wakeLock' in navigator) {
                    wakeLock = await navigator.wakeLock.request('screen');
                    if (statusEl) statusEl.innerText = '💡 Screen Wake Lock: ACTIVE';
                    wakeLock.addEventListener('release', () => {});
                }
            } catch (err) {}
        }

        document.addEventListener('visibilitychange', async () => {
            if (wakeLock !== null && document.visibilityState === 'visible') {
                await requestWakeLock();
            }
        });
    </script>
</body>
</html>
