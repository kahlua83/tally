<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VEDC Caster Signal System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .transition-bg { transition: background-color 0.25s ease, color 0.25s ease; }
        
        @keyframes pulse-fast {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
        .animate-pulse-fast { animation: pulse-fast 0.8s infinite; }

        .responsive-title {
            font-size: clamp(2rem, 7vw, 6rem);
            line-height: 1.1;
        }
        .responsive-subtext {
            font-size: clamp(1.1rem, 3.5vw, 2.5rem);
            line-height: 1.2;
        }
        .responsive-msg {
            font-size: clamp(1.2rem, 4vw, 3rem);
            line-height: 1.3;
        }
        .responsive-countdown {
            font-size: clamp(1.2rem, 3.8vw, 2.2rem);
        }
    </style>
</head>
<body class="bg-slate-950 text-white h-screen w-screen flex flex-col justify-between overflow-x-hidden font-sans select-none">

    <!-- ==================== KHU VỰC CHỌN JOB VÀ BÀN ==================== -->
    <div id="job-select-view" class="hidden flex-1 flex flex-col justify-center items-center p-4 sm:p-6 text-center bg-slate-950 min-h-screen">
        <div class="bg-slate-900 border-2 border-slate-800 p-6 sm:p-8 rounded-3xl max-w-md w-full shadow-2xl">
            <h1 class="text-2xl sm:text-3xl font-black text-indigo-400 mb-2 flex items-center justify-center gap-2">
                <span>🎛️ VEDC TALLY</span>
            </h1>
            <p id="select-step-title" class="text-slate-400 text-xs sm:text-sm mb-6">Bước 1: Chọn Job livestream để bắt đầu</p>

            <!-- BƯỚC 1: CHỌN JOB -->
            <div id="step-job-container" class="space-y-3 mb-6">
                <button onclick="selectPresetJob('job1')" class="w-full py-3.5 px-4 bg-indigo-600 hover:bg-indigo-500 font-bold rounded-xl transition flex items-center justify-between text-sm sm:text-base">
                    <span>📡 JOB 1 (Sự kiện 1)</span>
                    <span class="text-xs bg-indigo-900 px-2 py-1 rounded">job1</span>
                </button>
                <button onclick="selectPresetJob('job2')" class="w-full py-3.5 px-4 bg-emerald-600 hover:bg-emerald-500 font-bold rounded-xl transition flex items-center justify-between text-sm sm:text-base">
                    <span>🎧 JOB 2 (Sự kiện 2)</span>
                    <span class="text-xs bg-emerald-900 px-2 py-1 rounded">job2</span>
                </button>
                <button onclick="selectPresetJob('job3')" class="w-full py-3.5 px-4 bg-purple-600 hover:bg-purple-500 font-bold rounded-xl transition flex items-center justify-between text-sm sm:text-base">
                    <span>🎙️ JOB 3 (Sự kiện 3)</span>
                    <span class="text-xs bg-purple-900 px-2 py-1 rounded">job3</span>
                </button>
                
                <div class="pt-3 border-t border-slate-800">
                    <label class="block text-xs font-bold text-slate-400 uppercase mb-2 text-left">Hoặc nhập tên Job tùy chỉnh (vd: vmc-fall-2026):</label>
                    <div class="flex gap-2">
                        <input type="text" id="custom-job-input" placeholder="Nhập tên job..." class="flex-1 bg-slate-950 border border-slate-700 rounded-xl px-3.5 py-2 text-sm text-white focus:outline-none focus:border-indigo-500">
                        <button id="btn-custom-job" class="bg-slate-700 hover:bg-slate-600 px-4 py-2 rounded-xl text-xs font-bold transition whitespace-nowrap">VÀO</button>
                    </div>
                </div>
            </div>

            <!-- BƯỚC 2: CHỌN BÀN CASTER -->
            <div id="step-caster-desk-container" class="space-y-3 mb-6 hidden">
                <button onclick="selectCasterDesk('caster_1')" class="w-full py-4 px-4 bg-indigo-600 hover:bg-indigo-500 font-black text-base sm:text-lg rounded-2xl transition flex items-center justify-center gap-2">
                    🎙️ BÀN 1 (MAIN CASTER)
                </button>
                <button onclick="selectCasterDesk('caster_2')" class="w-full py-4 px-4 bg-teal-600 hover:bg-teal-500 font-black text-base sm:text-lg rounded-2xl transition flex items-center justify-center gap-2">
                    🎧 BÀN 2 (ANALYST DESK)
                </button>
                <button onclick="resetSelectStep()" class="text-xs font-bold text-slate-400 hover:text-white pt-2 underline">
                    ⬅️ Chọn lại Job khác
                </button>
            </div>
        </div>
    </div>

    <!-- ==================== KHU VỰC HIỂN THỊ CHO CASTER ==================== -->
    <div id="caster-view" class="hidden flex-1 flex flex-col justify-center items-center p-4 sm:p-8 text-center transition-bg bg-slate-950 relative h-full w-full overflow-hidden">
        
        <button id="btn-caster-reset" class="absolute top-3 right-3 sm:top-4 sm:right-4 bg-black/40 hover:bg-black/70 border border-white/20 px-3 py-1.5 rounded-full text-[10px] sm:text-xs font-bold text-slate-300 transition z-10">
            🔄 Đổi Bàn / Job
        </button>

        <div id="caster-countdown-banner" class="responsive-countdown font-extrabold text-amber-300 bg-black/70 px-6 sm:px-10 py-2.5 sm:py-3.5 rounded-2xl mb-4 sm:mb-8 tracking-wider uppercase border-2 border-amber-400/60 hidden animate-pulse-fast shadow-2xl max-w-full">
            ⏱️ ĐẾM NGƯỢC: <span id="caster-timer-num">5</span>s
        </div>

        <div id="status-badge" class="responsive-title font-black uppercase tracking-wider mb-3 sm:mb-6 px-6 sm:px-12 py-4 sm:py-8 rounded-2xl sm:rounded-3xl bg-black/40 shadow-2xl border-2 sm:border-4 border-white/20 max-w-full break-words">
            CONNECTING...
        </div>
        
        <div id="status-subtext" class="responsive-subtext font-bold tracking-wide uppercase opacity-90 mb-4 sm:mb-8 max-w-full break-words">
            Đang kết nối...
        </div>

        <div id="custom-msg" class="responsive-msg font-extrabold max-w-5xl w-full text-amber-300 bg-black/80 border-2 sm:border-4 border-amber-400 px-4 sm:px-8 py-4 sm:py-6 rounded-2xl shadow-2xl hidden animate-pulse-fast break-words">
        </div>

        <div id="wake-lock-status" class="absolute bottom-2 sm:bottom-4 text-[10px] sm:text-xs font-semibold text-slate-500 opacity-60">
            💡 Screen Wake Lock: Off
        </div>
    </div>

    <!-- ==================== KHU VỰC ĐIỀU KHIỂN CHO ĐẠO DIỄN ==================== -->
    <div id="director-view" class="hidden flex-1 p-4 sm:p-6 overflow-y-auto max-w-7xl mx-auto w-full">
        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 mb-6 pb-4 border-b border-slate-800">
            <h1 class="text-2xl sm:text-3xl font-black text-indigo-400 flex items-center gap-2">
                <span>🎛️ BẢNG ĐIỀU KHIỂN TALLY CASTER (VEDC)</span>
            </h1>
            <div class="flex items-center gap-2 sm:gap-3 flex-wrap">
                <span id="job-badge" class="bg-amber-950 text-amber-300 border border-amber-700/50 px-3 py-1 rounded-full text-xs font-bold uppercase tracking-wider">
                    🏷️ Job: Default
                </span>
                <button id="btn-change-job" class="bg-slate-800 hover:bg-slate-700 border border-slate-600 px-3 py-1 rounded-full text-xs font-bold text-slate-300 transition">
                    🔄 Đổi Job
                </button>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 sm:gap-8">
            <!-- BÀN 1 -->
            <div class="bg-slate-900 border-2 border-slate-800 rounded-3xl p-4 sm:p-6 shadow-xl flex flex-col justify-between">
                <div>
                    <div class="flex justify-between items-center mb-4 gap-2 flex-wrap">
                        <h2 class="text-xl sm:text-2xl font-bold text-slate-100 flex items-center gap-2">
                            <span>🎙️ BÀN 1</span> <span class="text-xs bg-slate-800 text-slate-400 px-2 py-0.5 rounded">MAIN</span>
                        </h2>
                        
                        <div class="flex items-center gap-2">
                            <div class="flex items-center bg-slate-950 border border-slate-700 rounded-xl px-2.5 py-1 text-xs font-bold text-slate-300">
                                <span class="mr-1 text-slate-400">⏱️ Sec:</span>
                                <input type="number" id="input-c1-sec" value="5" min="0" max="60" class="w-10 bg-slate-900 text-center text-white font-black rounded focus:outline-none focus:border-indigo-500 py-0.5">
                            </div>
                            <div id="monitor-c1" class="px-3 py-1.5 rounded-xl text-xs sm:text-sm font-black uppercase bg-slate-800 text-slate-400 border border-slate-700 transition-bg whitespace-nowrap">
                                STANDBY
                            </div>
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-2.5 sm:gap-3 mb-4">
                        <button id="btn-c1-onair" class="p-3 sm:p-3.5 rounded-2xl bg-red-700 hover:bg-red-600 font-black text-sm sm:text-base shadow-lg transition active:scale-95 text-left flex flex-col col-span-2">
                            <span>📡 STREAM ON AIR</span>
                            <span class="text-[10px] sm:text-xs font-normal opacity-80">LUỒNG LIVESTREAM ĐANG LÊN SÓNG</span>
                        </button>
                        <button id="btn-c1-cam-on" class="p-3 sm:p-3.5 rounded-2xl bg-red-600 hover:bg-red-500 font-black text-sm sm:text-base shadow-lg transition active:scale-95 text-left flex flex-col">
                            <span>🎥 CASTER LÊN HÌNH</span>
                            <span class="text-[10px] sm:text-xs font-normal opacity-80">ON CAMERA</span>
                        </button>
                        <button id="btn-c1-cam-off" class="p-3 sm:p-3.5 rounded-2xl bg-black hover:bg-slate-900 border-2 border-red-500 text-white font-black text-sm sm:text-base shadow-lg transition active:scale-95 text-left flex flex-col">
                            <span>🎙️ CASTER XUỐNG HÌNH</span>
                            <span class="text-[10px] sm:text-xs font-normal opacity-80">OFF CAM (VẪN BÌNH LUẬN)</span>
                        </button>
                        <button id="btn-c1-standby" class="p-3 sm:p-3.5 rounded-2xl bg-emerald-600 hover:bg-emerald-500 font-black text-sm sm:text-base shadow-lg transition active:scale-95 text-left flex flex-col">
                            <span>🟢 PREVIEW</span>
                            <span class="text-[10px] sm:text-xs font-normal opacity-80">STANDBY / CHUẨN BỊ</span>
                        </button>
                        <button id="btn-c1-caugio" class="p-3 sm:p-3.5 rounded-2xl bg-amber-500 hover:bg-amber-400 text-slate-950 font-black text-sm sm:text-base shadow-lg transition active:scale-95 text-left flex flex-col">
                            <span>🟡 CÂU GIỜ</span>
                            <span class="text-[10px] sm:text-xs font-normal opacity-80">HOLD TIME</span>
                        </button>
                        <button id="btn-c1-out" class="p-3 sm:p-3.5 rounded-2xl bg-blue-600 hover:bg-blue-500 font-black text-sm sm:text-base shadow-lg transition active:scale-95 text-left flex flex-col">
                            <span>🔵 CASTER OUT</span>
                            <span class="text-[10px] sm:text-xs font-normal opacity-80">BÌNH LUẬN XONG</span>
                        </button>
                        <button id="btn-c1-break" class="p-3 sm:p-3.5 rounded-2xl bg-purple-600 hover:bg-purple-500 font-black text-sm sm:text-base shadow-lg transition active:scale-95 text-left flex flex-col">
                            <span>🟣 BREAK</span>
                            <span class="text-[10px] sm:text-xs font-normal opacity-80">NGHỈ GIẢI LAO</span>
                        </button>
                    </div>
                </div>

                <div class="bg-slate-950/60 p-3.5 sm:p-4 rounded-2xl border border-slate-800">
                    <label class="block text-xs font-bold uppercase mb-2 text-amber-400">⚠️ Chú ý lời nhắc (Bàn 1):</label>
                    <div class="flex gap-2">
                        <input type="text" id="input-c1-msg" placeholder="Gõ lời nhắc khẩn cấp..." class="flex-1 bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs sm:text-sm text-white focus:outline-none focus:border-amber-500">
                        <button id="btn-c1-sendmsg" class="bg-amber-500 hover:bg-amber-400 text-slate-950 px-3.5 py-2 rounded-xl text-xs font-black transition whitespace-nowrap">GỬI</button>
                        <button id="btn-c1-clearmsg" class="bg-slate-800 hover:bg-slate-700 px-3 py-2 rounded-xl text-xs font-bold text-slate-400 transition whitespace-nowrap">XÓA</button>
                    </div>
                </div>
            </div>

            <!-- BÀN 2 -->
            <div class="bg-slate-900 border-2 border-slate-800 rounded-3xl p-4 sm:p-6 shadow-xl flex flex-col justify-between">
                <div>
                    <div class="flex justify-between items-center mb-4 gap-2 flex-wrap">
                        <h2 class="text-xl sm:text-2xl font-bold text-slate-100 flex items-center gap-2">
                            <span>🎧 BÀN 2</span> <span class="text-xs bg-slate-800 text-slate-400 px-2 py-0.5 rounded">ANALYST</span>
                        </h2>
                        
                        <div class="flex items-center gap-2">
                            <div class="flex items-center bg-slate-950 border border-slate-700 rounded-xl px-2.5 py-1 text-xs font-bold text-slate-300">
                                <span class="mr-1 text-slate-400">⏱️ Sec:</span>
                                <input type="number" id="input-c2-sec" value="5" min="0" max="60" class="w-10 bg-slate-900 text-center text-white font-black rounded focus:outline-none focus:border-indigo-500 py-0.5">
                            </div>
                            <div id="monitor-c2" class="px-3 py-1.5 rounded-xl text-xs sm:text-sm font-black uppercase bg-slate-800 text-slate-400 border border-slate-700 transition-bg whitespace-nowrap">
                                STANDBY
                            </div>
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-2.5 sm:gap-3 mb-4">
                        <button id="btn-c2-onair" class="p-3 sm:p-3.5 rounded-2xl bg-red-700 hover:bg-red-600 font-black text-sm sm:text-base shadow-lg transition active:scale-95 text-left flex flex-col col-span-2">
                            <span>📡 STREAM ON AIR</span>
                            <span class="text-[10px] sm:text-xs font-normal opacity-80">LUỒNG LIVESTREAM ĐANG LÊN SÓNG</span>
                        </button>
                        <button id="btn-c2-cam-on" class="p-3 sm:p-3.5 rounded-2xl bg-red-600 hover:bg-red-500 font-black text-sm sm:text-base shadow-lg transition active:scale-95 text-left flex flex-col">
                            <span>🎥 CASTER LÊN HÌNH</span>
                            <span class="text-[10px] sm:text-xs font-normal opacity-80">ON CAMERA</span>
                        </button>
                        <button id="btn-c2-cam-off" class="p-3 sm:p-3.5 rounded-2xl bg-black hover:bg-slate-900 border-2 border-red-500 text-white font-black text-sm sm:text-base shadow-lg transition active:scale-95 text-left flex flex-col">
                            <span>🎙️ CASTER XUỐNG HÌNH</span>
                            <span class="text-[10px] sm:text-xs font-normal opacity-80">OFF CAM (VẪN BÌNH LUẬN)</span>
                        </button>
                        <button id="btn-c2-standby" class="p-3 sm:p-3.5 rounded-2xl bg-emerald-600 hover:bg-emerald-500 font-black text-sm sm:text-base shadow-lg transition active:scale-95 text-left flex flex-col">
                            <span>🟢 PREVIEW</span>
                            <span class="text-[10px] sm:text-xs font-normal opacity-80">STANDBY / CHUẨN BỊ</span>
                        </button>
                        <button id="btn-c2-caugio" class="p-3 sm:p-3.5 rounded-2xl bg-amber-500 hover:bg-amber-400 text-slate-950 font-black text-sm sm:text-base shadow-lg transition active:scale-95 text-left flex flex-col">
                            <span>🟡 CÂU GIỜ</span>
                            <span class="text-[10px] sm:text-xs font-normal opacity-80">HOLD TIME</span>
                        </button>
                        <button id="btn-c2-out" class="p-3 sm:p-3.5 rounded-2xl bg-blue-600 hover:bg-blue-500 font-black text-sm sm:text-base shadow-lg transition active:scale-95 text-left flex flex-col">
                            <span>🔵 CASTER OUT</span>
                            <span class="text-[10px] sm:text-xs font-normal opacity-80">BÌNH LUẬN XONG</span>
                        </button>
                        <button id="btn-c2-break" class="p-3 sm:p-3.5 rounded-2xl bg-purple-600 hover:bg-purple-500 font-black text-sm sm:text-base shadow-lg transition active:scale-95 text-left flex flex-col">
                            <span>🟣 BREAK</span>
                            <span class="text-[10px] sm:text-xs font-normal opacity-80">NGHỈ GIẢI LAO</span>
                        </button>
                    </div>
                </div>

                <div class="bg-slate-950/60 p-3.5 sm:p-4 rounded-2xl border border-slate-800">
                    <label class="block text-xs font-bold uppercase mb-2 text-amber-400">⚠️ Chú ý lời nhắc (Bàn 2):</label>
                    <div class="flex gap-2">
                        <input type="text" id="input-c2-msg" placeholder="Gõ lời nhắc khẩn cấp..." class="flex-1 bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs sm:text-sm text-white focus:outline-none focus:border-amber-500">
                        <button id="btn-c2-sendmsg" class="bg-amber-500 hover:bg-amber-400 text-slate-950 px-3.5 py-2 rounded-xl text-xs font-black transition whitespace-nowrap">GỬI</button>
                        <button id="btn-c2-clearmsg" class="bg-slate-800 hover:bg-slate-700 px-3 py-2 rounded-xl text-xs font-bold text-slate-400 transition whitespace-nowrap">XÓA</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- SCRIPT TÍCH HỢP FIREBASE -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDJZo-qh1VsbaixImBQOWTc5g1KLY4ugvc",
            authDomain: "vedc-tally-signal-1470d.firebaseapp.com",
            databaseURL: "https://vedc-tally-signal-1470d-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "vedc-tally-signal-1470d",
            storageBucket: "vedc-tally-signal-1470d.firebasestorage.app",
            messagingSenderId: "208327260119",
            appId: "1:208327260119:web:dc063b12622626472efd92",
            measurementId: "G-KXC2301E50"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const urlParams = new URLSearchParams(window.location.search);
        const role = urlParams.get('role') || 'director';
        let casterId = urlParams.get('id');
        let jobId = urlParams.get('job');

        // Chuẩn hóa tên Job thành dạng slug an toàn với Firebase (loại bỏ khoảng trắng, chữ hoa, ký tự đặc biệt)
        function cleanJobId(id) {
            if (!id) return '';
            return id.trim().toLowerCase().replace(/\s+/g, '-').replace(/[^a-z0-9-_]/g, '');
        }

        if (jobId) jobId = cleanJobId(jobId);

        if (!jobId) {
            document.getElementById('job-select-view').classList.remove('hidden');
            document.getElementById('step-job-container').classList.remove('hidden');
            document.getElementById('step-caster-desk-container').classList.add('hidden');
            document.getElementById('select-step-title').innerText = "Bước 1: Chọn Job livestream để bắt đầu";
        } else if (role === 'caster' && !casterId) {
            document.getElementById('job-select-view').classList.remove('hidden');
            document.getElementById('step-job-container').classList.add('hidden');
            document.getElementById('step-caster-desk-container').classList.remove('hidden');
            document.getElementById('select-step-title').innerText = "Bước 2: Chọn màn hình Bàn Caster (Job: " + jobId + ")";
        } else {
            startApp();
        }

        window.selectPresetJob = function(jobName) {
            urlParams.set('job', cleanJobId(jobName));
            window.location.search = urlParams.toString();
        };

        document.getElementById('btn-custom-job').onclick = () => {
            const val = document.getElementById('custom-job-input').value.trim();
            if (val) window.selectPresetJob(val);
        };

        window.selectCasterDesk = function(selectedDeskId) {
            urlParams.set('id', selectedDeskId);
            window.location.search = urlParams.toString();
        };

        window.resetSelectStep = function() {
            urlParams.delete('job');
            urlParams.delete('id');
            window.location.search = urlParams.toString();
        };

        document.getElementById('btn-change-job').onclick = resetSelectStep;
        document.getElementById('btn-caster-reset').onclick = resetSelectStep;

        function startApp() {
            document.getElementById('job-select-view').classList.add('hidden');

            if (role === 'director') {
                document.getElementById('director-view').classList.remove('hidden');
                document.getElementById('job-badge').innerText = '🏷️ Job: ' + jobId;
                initDirectorPanel();
            } else {
                document.getElementById('caster-view').classList.remove('hidden');
                initCasterTablet(casterId);
                requestWakeLock();
            }
        }

        function getDbRef(targetCaster) {
            return ref(db, `jobs/${jobId}/signals/${targetCaster}`);
        }

        function initDirectorPanel() {
            document.getElementById('btn-c1-onair').onclick = () => sendSignal('caster_1', 'STREAM ON AIR', 'LUỒNG SÓNG ĐANG PHÁT', 'bg-red-700', 'text-white', 'input-c1-sec');
            document.getElementById('btn-c1-cam-on').onclick = () => sendSignal('caster_1', 'CASTER LÊN HÌNH', 'ON CAMERA', 'bg-red-600', 'text-white', 'input-c1-sec');
            document.getElementById('btn-c1-cam-off').onclick = () => sendSignal('caster_1', 'CASTER XUỐNG HÌNH', 'OFF CAM (VẪN BÌNH LUẬN)', 'bg-black border-4 border-red-500', 'text-white', 'input-c1-sec');
            document.getElementById('btn-c1-standby').onclick = () => sendSignal('caster_1', 'PREVIEW', 'STANDBY / CHUẨN BỊ', 'bg-emerald-600', 'text-white', 'input-c1-sec');
            document.getElementById('btn-c1-caugio').onclick = () => sendSignal('caster_1', 'CÂU GIỜ', 'HOLD TIME', 'bg-amber-500', 'text-slate-950', 'input-c1-sec');
            document.getElementById('btn-c1-out').onclick = () => sendSignal('caster_1', 'CASTER OUT', 'BÌNH LUẬN XONG', 'bg-blue-600', 'text-white', 'input-c1-sec');
            document.getElementById('btn-c1-break').onclick = () => sendSignal('caster_1', 'BREAK', 'NGHỈ GIẢI LAO', 'bg-purple-600', 'text-white', 'input-c1-sec');
            document.getElementById('btn-c1-sendmsg').onclick = () => sendQuickMsg('caster_1', 'input-c1-msg');
            document.getElementById('btn-c1-clearmsg').onclick = () => clearQuickMsg('caster_1');

            document.getElementById('btn-c2-onair').onclick = () => sendSignal('caster_2', 'STREAM ON AIR', 'LUỒNG SÓNG ĐANG PHÁT', 'bg-red-700', 'text-white', 'input-c2-sec');
            document.getElementById('btn-c2-cam-on').onclick = () => sendSignal('caster_2', 'CASTER LÊN HÌNH', 'ON CAMERA', 'bg-red-600', 'text-white', 'input-c2-sec');
            document.getElementById('btn-c2-cam-off').onclick = () => sendSignal('caster_2', 'CASTER XUỐNG HÌNH', 'OFF CAM (VẪN BÌNH LUẬN)', 'bg-black border-4 border-red-500', 'text-white', 'input-c2-sec');
            document.getElementById('btn-c2-standby').onclick = () => sendSignal('caster_2', 'PREVIEW', 'STANDBY / CHUẨN BỊ', 'bg-emerald-600', 'text-white', 'input-c2-sec');
            document.getElementById('btn-c2-caugio').onclick = () => sendSignal('caster_2', 'CÂU GIỜ', 'HOLD TIME', 'bg-amber-500', 'text-slate-950', 'input-c2-sec');
            document.getElementById('btn-c2-out').onclick = () => sendSignal('caster_2', 'CASTER OUT', 'BÌNH LUẬN XONG', 'bg-blue-600', 'text-white', 'input-c2-sec');
            document.getElementById('btn-c2-break').onclick = () => sendSignal('caster_2', 'BREAK', 'NGHỈ GIẢI LAO', 'bg-purple-600', 'text-white', 'input-c2-sec');
            document.getElementById('btn-c2-sendmsg').onclick = () => sendQuickMsg('caster_2', 'input-c2-msg');
            document.getElementById('btn-c2-clearmsg').onclick = () => clearQuickMsg('caster_2');

            listenMonitor('caster_1', 'monitor-c1');
            listenMonitor('caster_2', 'monitor-c2');
        }

        function sendSignal(targetId, titleEng, titleVie, bgClass, textClass, secInputId) {
            const countdownSec = parseInt(document.getElementById(secInputId).value) || 0;
            set(getDbRef(targetId), {
                titleEng: titleEng,
                titleVie: titleVie,
                bgClass: bgClass,
                textClass: textClass,
                message: '',
                countdownSec: countdownSec,
                triggerTime: Date.now()
            }).catch(err => alert("Lỗi: " + err.message));
        }

        function sendQuickMsg(targetId, inputId) {
            const input = document.getElementById(inputId);
            const msg = input.value.trim();
            if(!msg) return;

            const targetRef = getDbRef(targetId);
            onValue(targetRef, (snapshot) => {
                const data = snapshot.val() || {};
                set(targetRef, { ...data, message: msg });
            }, { onlyOnce: true });
            input.value = '';
        }

        function clearQuickMsg(targetId) {
            const targetRef = getDbRef(targetId);
            onValue(targetRef, (snapshot) => {
                const data = snapshot.val() || {};
                set(targetRef, { ...data, message: '' });
            }, { onlyOnce: true });
        }

        function listenMonitor(targetId, elementId) {
            const monitorEl = document.getElementById(elementId);
            onValue(getDbRef(targetId), (snapshot) => {
                const data = snapshot.val();
                if (data) {
                    monitorEl.innerText = data.titleEng + ' (' + data.titleVie + ')';
                    monitorEl.className = `px-3 py-1.5 rounded-xl text-xs sm:text-sm font-black uppercase shadow whitespace-nowrap ${data.bgClass} ${data.textClass}`;
                }
            });
        }

        let lastTriggerTime = 0;
        let activeTimer = null;

        function initCasterTablet(targetId) {
            const bodyBg = document.getElementById('caster-view');
            const statusBadge = document.getElementById('status-badge');
            const statusSubtext = document.getElementById('status-subtext');
            const customMsg = document.getElementById('custom-msg');
            const countdownBanner = document.getElementById('caster-countdown-banner');
            const timerNum = document.getElementById('caster-timer-num');

            onValue(getDbRef(targetId), (snapshot) => {
                const data = snapshot.val();
                
                // Nếu chưa có dữ liệu trên server cho job này, hiển thị trạng thái chờ mặc định thay vì kẹt Connecting
                if (!data) {
                    bodyBg.className = "flex-1 flex flex-col justify-center items-center p-4 sm:p-8 text-center transition-bg h-full w-full overflow-hidden relative bg-slate-950 text-white";
                    statusBadge.innerText = 'PREVIEW';
                    statusSubtext.innerText = 'ĐÃ KẾT NỐI - CHỜ TÍN HIỆU';
                    return;
                }

                bodyBg.className = "flex-1 flex flex-col justify-center items-center p-4 sm:p-8 text-center transition-bg h-full w-full overflow-hidden relative " + (data.bgClass || 'bg-slate-950') + " " + (data.textClass || 'text-white');
                statusBadge.innerText = data.titleEng || 'STANDBY';
                statusSubtext.innerText = data.titleVie || 'SẴN SÀNG';

                if (data.message && data.message.trim() !== '') {
                    customMsg.innerText = `⚠️ LỜI NHẮC: ${data.message}`;
                    customMsg.classList.remove('hidden');
                } else {
                    customMsg.classList.add('hidden');
                }

                if (data.triggerTime && data.triggerTime !== lastTriggerTime) {
                    lastTriggerTime = data.triggerTime;

                    if (data.countdownSec && data.countdownSec > 0) {
                        if (activeTimer) clearInterval(activeTimer);
                        
                        let remainingSec = data.countdownSec;
                        countdownBanner.classList.remove('hidden');
                        timerNum.innerText = remainingSec;

                        activeTimer = setInterval(() => {
                            remainingSec--;
                            if (remainingSec > 0) {
                                timerNum.innerText = remainingSec;
                            } else {
                                clearInterval(activeTimer);
                                countdownBanner.classList.add('hidden');
                            }
                        }, 1000);
                    } else {
                        if (activeTimer) clearInterval(activeTimer);
                        countdownBanner.classList.add('hidden');
                    }
                }
            });
        }

        let wakeLock = null;
        async function requestWakeLock() {
            const statusEl = document.getElementById('wake-lock-status');
            try {
                if ('wakeLock' in navigator) {
                    wakeLock = await navigator.wakeLock.request('screen');
                    if (statusEl) statusEl.innerText = '💡 Screen Wake Lock: ACTIVE';
                    wakeLock.addEventListener('release', () => {});
                }
            } catch (err) {}
        }

        document.addEventListener('visibilitychange', async () => {
            if (wakeLock !== null && document.visibilityState === 'visible') {
                await requestWakeLock();
            }
        });
    </script>
</body>
</html>
