<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VEDC Caster Signal System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .transition-bg { transition: background-color 0.25s ease, color 0.25s ease; }
        @keyframes pulse-fast {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
        .animate-pulse-fast { animation: pulse-fast 0.8s infinite; }
    </style>
</head>
<body class="bg-slate-950 text-white h-screen flex flex-col justify-between overflow-hidden font-sans">

    <!-- ==================== KHU VỰC HIỂN THỊ CHO CASTER (TABLET/PHONE) ==================== -->
    <div id="caster-view" class="hidden flex-1 flex flex-col justify-center items-center p-6 text-center transition-bg bg-slate-950 relative">
        <!-- Dòng đếm ngược hiển thị phía trên trạng thái chính -->
        <div id="caster-countdown-banner" class="text-2xl md:text-4xl font-extrabold text-amber-300 bg-black/60 px-8 py-3 rounded-2xl mb-6 tracking-wider uppercase border-2 border-amber-400/50 hidden animate-pulse-fast">
            ⏱️ ĐẾM NGƯỢC: <span id="caster-timer-num">5</span>s
        </div>

        <!-- Đèn Tally Trạng Thái Chính -->
        <div id="status-badge" class="text-5xl md:text-8xl font-black uppercase tracking-wider mb-6 px-10 py-6 rounded-3xl bg-black/40 shadow-2xl border-4 border-white/20">
            CONNECTING...
        </div>
        <div id="status-subtext" class="text-2xl md:text-4xl font-bold tracking-wide uppercase opacity-90 mb-8">
            Đang kết nối...
        </div>

        <!-- Chú ý lời nhắc từ Đạo diễn -->
        <div id="custom-msg" class="text-3xl md:text-5xl font-extrabold max-w-5xl text-amber-300 bg-black/70 border-4 border-amber-400 px-8 py-6 rounded-2xl shadow-2xl hidden animate-pulse-fast">
        </div>

        <!-- Tín hiệu giữ sáng màn hình Screen Wake Lock -->
        <div id="wake-lock-status" class="absolute bottom-4 text-xs font-semibold text-slate-500 opacity-60">
            💡 Screen Wake Lock: Off
        </div>
    </div>

    <!-- ==================== KHU VỰC ĐIỀU KHIỂN CHO ĐẠO DIỄN (PC) ==================== -->
    <div id="director-view" class="hidden flex-1 p-6 overflow-y-auto max-w-7xl mx-auto w-full">
        <div class="flex justify-between items-center mb-6 pb-4 border-b border-slate-800">
            <h1 class="text-3xl font-black text-indigo-400 flex items-center gap-3">
                <span>🎛️ BẢNG ĐIỀU KHIỂN TALLY CASTER (VEDC)</span>
            </h1>
            <span class="bg-indigo-950 text-indigo-300 border border-indigo-700/50 px-4 py-1.5 rounded-full text-xs font-bold uppercase tracking-wider">
                ⚡ Realtime Dual-Panel Mode
            </span>
        </div>

        <!-- Chia 2 cột riêng biệt cho Bàn 1 & Bàn 2 -->
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">

            <!-- ================= BÀN 1 (MAIN CASTER) ================= -->
            <div class="bg-slate-900 border-2 border-slate-800 rounded-3xl p-6 shadow-xl flex flex-col justify-between">
                <div>
                    <div class="flex justify-between items-center mb-4">
                        <h2 class="text-2xl font-bold text-slate-100 flex items-center gap-2">
                            <span>🎙️ BÀN 1</span> <span class="text-xs bg-slate-800 text-slate-400 px-2.5 py-1 rounded-md">MAIN</span>
                        </h2>
                        
                        <!-- Ô tùy chọn điền số giây đếm ngược & Màn hình monitor thu nhỏ -->
                        <div class="flex items-center gap-2">
                            <div class="flex items-center bg-slate-950 border border-slate-700 rounded-xl px-2.5 py-1 text-xs font-bold text-slate-300">
                                <span class="mr-1 text-slate-400">⏱️ Sec:</span>
                                <input type="number" id="input-c1-sec" value="5" min="0" max="60" class="w-10 bg-slate-900 text-center text-white font-black rounded focus:outline-none focus:border-indigo-500 py-0.5">
                            </div>
                            <div id="monitor-c1" class="px-4 py-2 rounded-xl text-sm font-black uppercase bg-slate-800 text-slate-400 border border-slate-700 transition-bg">
                                STANDBY
                            </div>
                        </div>
                    </div>

                    <!-- Lưới các nút bấm Bàn 1 -->
                    <div class="grid grid-cols-2 gap-3 mb-4">
                        <button id="btn-c1-onair" class="p-3.5 rounded-2xl bg-red-700 hover:bg-red-600 font-black text-base shadow-lg transition active:scale-95 text-left flex flex-col col-span-2">
                            <span>📡 STREAM ON AIR</span>
                            <span class="text-xs font-normal opacity-80">LUỒNG LIVESTREAM ĐANG LÊN SÓNG</span>
                        </button>

                        <button id="btn-c1-cam-on" class="p-3.5 rounded-2xl bg-red-600 hover:bg-red-500 font-black text-base shadow-lg transition active:scale-95 text-left flex flex-col">
                            <span>🎥 CASTER LÊN HÌNH</span>
                            <span class="text-xs font-normal opacity-80">ON CAMERA</span>
                        </button>

                        <button id="btn-c1-cam-off" class="p-3.5 rounded-2xl bg-black hover:bg-slate-900 border-2 border-red-500 text-white font-black text-base shadow-lg transition active:scale-95 text-left flex flex-col">
                            <span>🎙️ CASTER XUỐNG HÌNH</span>
                            <span class="text-xs font-normal opacity-80">OFF CAM (VẪN BÌNH LUẬN)</span>
                        </button>

                        <button id="btn-c1-standby" class="p-3.5 rounded-2xl bg-emerald-600 hover:bg-emerald-500 font-black text-base shadow-lg transition active:scale-95 text-left flex flex-col">
                            <span>🟢 PREVIEW</span>
                            <span class="text-xs font-normal opacity-80">STANDBY / CHUẨN BỊ</span>
                        </button>

                        <button id="btn-c1-caugio" class="p-3.5 rounded-2xl bg-amber-500 hover:bg-amber-400 text-slate-950 font-black text-base shadow-lg transition active:scale-95 text-left flex flex-col">
                            <span>🟡 CÂU GIỜ</span>
                            <span class="text-xs font-normal opacity-80">HOLD TIME</span>
                        </button>

                        <button id="btn-c1-out" class="p-3.5 rounded-2xl bg-blue-600 hover:bg-blue-500 font-black text-base shadow-lg transition active:scale-95 text-left flex flex-col">
                            <span>🔵 CASTER OUT</span>
                            <span class="text-xs font-normal opacity-80">BÌNH LUẬN XONG</span>
                        </button>

                        <button id="btn-c1-break" class="p-3.5 rounded-2xl bg-purple-600 hover:bg-purple-500 font-black text-base shadow-lg transition active:scale-95 text-left flex flex-col">
                            <span>🟣 BREAK</span>
                            <span class="text-xs font-normal opacity-80">NGHỈ GIẢI LAO</span>
                        </button>
                    </div>
                </div>

                <!-- Lời nhắc nhanh Bàn 1 -->
                <div class="bg-slate-950/60 p-4 rounded-2xl border border-slate-800">
                    <label class="block text-xs font-bold uppercase mb-2 text-amber-400">⚠️ Chú ý lời nhắc (Bàn 1):</label>
                    <div class="flex gap-2">
                        <input type="text" id="input-c1-msg" placeholder="Gõ lời nhắc khẩn cấp..." class="flex-1 bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-2 text-sm text-white focus:outline-none focus:border-amber-500">
                        <button id="btn-c1-sendmsg" class="bg-amber-500 hover:bg-amber-400 text-slate-950 px-4 py-2 rounded-xl text-xs font-black transition">GỬI</button>
                        <button id="btn-c1-clearmsg" class="bg-slate-800 hover:bg-slate-700 px-3 py-2 rounded-xl text-xs font-bold text-slate-400 transition">XÓA</button>
                    </div>
                </div>
            </div>

            <!-- ================= BÀN 2 (ANALYST / DESK) ================= -->
            <div class="bg-slate-900 border-2 border-slate-800 rounded-3xl p-6 shadow-xl flex flex-col justify-between">
                <div>
                    <div class="flex justify-between items-center mb-4">
                        <h2 class="text-2xl font-bold text-slate-100 flex items-center gap-2">
                            <span>🎧 BÀN 2</span> <span class="text-xs bg-slate-800 text-slate-400 px-2.5 py-1 rounded-md">ANALYST</span>
                        </h2>
                        
                        <!-- Ô tùy chọn điền số giây đếm ngược & Màn hình monitor thu nhỏ -->
                        <div class="flex items-center gap-2">
                            <div class="flex items-center bg-slate-950 border border-slate-700 rounded-xl px-2.5 py-1 text-xs font-bold text-slate-300">
                                <span class="mr-1 text-slate-400">⏱️ Sec:</span>
                                <input type="number" id="input-c2-sec" value="5" min="0" max="60" class="w-10 bg-slate-900 text-center text-white font-black rounded focus:outline-none focus:border-indigo-500 py-0.5">
                            </div>
                            <div id="monitor-c2" class="px-4 py-2 rounded-xl text-sm font-black uppercase bg-slate-800 text-slate-400 border border-slate-700 transition-bg">
                                STANDBY
                            </div>
                        </div>
                    </div>

                    <!-- Lưới các nút bấm Bàn 2 -->
                    <div class="grid grid-cols-2 gap-3 mb-4">
                        <button id="btn-c2-onair" class="p-3.5 rounded-2xl bg-red-700 hover:bg-red-600 font-black text-base shadow-lg transition active:scale-95 text-left flex flex-col col-span-2">
                            <span>📡 STREAM ON AIR</span>
                            <span class="text-xs font-normal opacity-80">LUỒNG LIVESTREAM ĐANG LÊN SÓNG</span>
                        </button>

                        <button id="btn-c2-cam-on" class="p-3.5 rounded-2xl bg-red-600 hover:bg-red-500 font-black text-base shadow-lg transition active:scale-95 text-left flex flex-col">
                            <span>🎥 CASTER LÊN HÌNH</span>
                            <span class="text-xs font-normal opacity-80">ON CAMERA</span>
                        </button>

                        <button id="btn-c2-cam-off" class="p-3.5 rounded-2xl bg-black hover:bg-slate-900 border-2 border-red-500 text-white font-black text-base shadow-lg transition active:scale-95 text-left flex flex-col">
                            <span>🎙️ CASTER XUỐNG HÌNH</span>
                            <span class="text-xs font-normal opacity-80">OFF CAM (VẪN BÌNH LUẬN)</span>
                        </button>

                        <button id="btn-c2-standby" class="p-3.5 rounded-2xl bg-emerald-600 hover:bg-emerald-500 font-black text-base shadow-lg transition active:scale-95 text-left flex flex-col">
                            <span>🟢 PREVIEW</span>
                            <span class="text-xs font-normal opacity-80">STANDBY / CHUẨN BỊ</span>
                        </button>

                        <button id="btn-c2-caugio" class="p-3.5 rounded-2xl bg-amber-500 hover:bg-amber-400 text-slate-950 font-black text-base shadow-lg transition active:scale-95 text-left flex flex-col">
                            <span>🟡 CÂU GIỜ</span>
                            <span class="text-xs font-normal opacity-80">HOLD TIME</span>
                        </button>

                        <button id="btn-c2-out" class="p-3.5 rounded-2xl bg-blue-600 hover:bg-blue-500 font-black text-base shadow-lg transition active:scale-95 text-left flex flex-col">
                            <span>🔵 CASTER OUT</span>
                            <span class="text-xs font-normal opacity-80">BÌNH LUẬN XONG</span>
                        </button>

                        <button id="btn-c2-break" class="p-3.5 rounded-2xl bg-purple-600 hover:bg-purple-500 font-black text-base shadow-lg transition active:scale-95 text-left flex flex-col">
                            <span>🟣 BREAK</span>
                            <span class="text-xs font-normal opacity-80">NGHỈ GIẢI LAO</span>
                        </button>
                    </div>
                </div>

                <!-- Lời nhắc nhanh Bàn 2 -->
                <div class="bg-slate-950/60 p-4 rounded-2xl border border-slate-800">
                    <label class="block text-xs font-bold uppercase mb-2 text-amber-400">⚠️ Chú ý lời nhắc (Bàn 2):</label>
                    <div class="flex gap-2">
                        <input type="text" id="input-c2-msg" placeholder="Gõ lời nhắc khẩn cấp..." class="flex-1 bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-2 text-sm text-white focus:outline-none focus:border-amber-500">
                        <button id="btn-c2-sendmsg" class="bg-amber-500 hover:bg-amber-400 text-slate-950 px-4 py-2 rounded-xl text-xs font-black transition">GỬI</button>
                        <button id="btn-c2-clearmsg" class="bg-slate-800 hover:bg-slate-700 px-3 py-2 rounded-xl text-xs font-bold text-slate-400 transition">XÓA</button>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <!-- SCRIPT TÍCH HỢP FIREBASE -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDJZo-qh1VsbaixImBQOWTc5g1KLY4ugvc",
            authDomain: "vedc-tally-signal-1470d.firebaseapp.com",
            databaseURL: "https://vedc-tally-signal-1470d-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "vedc-tally-signal-1470d",
            storageBucket: "vedc-tally-signal-1470d.firebasestorage.app",
            messagingSenderId: "208327260119",
            appId: "1:208327260119:web:dc063b12622626472efd92",
            measurementId: "G-KXC2301E50"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const urlParams = new URLSearchParams(window.location.search);
        const role = urlParams.get('role') || 'director';
        const casterId = urlParams.get('id') || 'caster_1';

        if (role === 'director') {
            document.getElementById('director-view').classList.remove('hidden');
            initDirectorPanel();
        } else {
            document.getElementById('caster-view').classList.remove('hidden');
            initCasterTablet(casterId);
            requestWakeLock();
        }

        // --- ĐẠO DIỄN: Gán sự kiện trực tiếp cho Bàn 1 & Bàn 2 ---
        function initDirectorPanel() {
            // Sự kiện Bàn 1
            document.getElementById('btn-c1-onair').onclick = () => sendSignal('caster_1', 'STREAM ON AIR', 'LUỒNG SÓNG ĐANG PHÁT', 'bg-red-700', 'text-white', 'input-c1-sec');
            document.getElementById('btn-c1-cam-on').onclick = () => sendSignal('caster_1', 'CASTER LÊN HÌNH', 'ON CAMERA', 'bg-red-600', 'text-white', 'input-c1-sec');
            document.getElementById('btn-c1-cam-off').onclick = () => sendSignal('caster_1', 'CASTER XUỐNG HÌNH', 'OFF CAM (VẪN BÌNH LUẬN)', 'bg-black border-4 border-red-500', 'text-white', 'input-c1-sec');
            document.getElementById('btn-c1-standby').onclick = () => sendSignal('caster_1', 'PREVIEW', 'STANDBY / CHUẨN BỊ', 'bg-emerald-600', 'text-white', 'input-c1-sec');
            document.getElementById('btn-c1-caugio').onclick = () => sendSignal('caster_1', 'CÂU GIỜ', 'HOLD TIME', 'bg-amber-500', 'text-slate-950', 'input-c1-sec');
            document.getElementById('btn-c1-out').onclick = () => sendSignal('caster_1', 'CASTER OUT', 'BÌNH LUẬN XONG', 'bg-blue-600', 'text-white', 'input-c1-sec');
            document.getElementById('btn-c1-break').onclick = () => sendSignal('caster_1', 'BREAK', 'NGHỈ GIẢI LAO', 'bg-purple-600', 'text-white', 'input-c1-sec');
            document.getElementById('btn-c1-sendmsg').onclick = () => sendQuickMsg('caster_1', 'input-c1-msg');
            document.getElementById('btn-c1-clearmsg').onclick = () => clearQuickMsg('caster_1');

            // Sự kiện Bàn 2
            document.getElementById('btn-c2-onair').onclick = () => sendSignal('caster_2', 'STREAM ON AIR', 'LUỒNG SÓNG ĐANG PHÁT', 'bg-red-700', 'text-white', 'input-c2-sec');
            document.getElementById('btn-c2-cam-on').onclick = () => sendSignal('caster_2', 'CASTER LÊN HÌNH', 'ON CAMERA', 'bg-red-600', 'text-white', 'input-c2-sec');
            document.getElementById('btn-c2-cam-off').onclick = () => sendSignal('caster_2', 'CASTER XUỐNG HÌNH', 'OFF CAM (VẪN BÌNH LUẬN)', 'bg-black border-4 border-red-500', 'text-white', 'input-c2-sec');
            document.getElementById('btn-c2-standby').onclick = () => sendSignal('caster_2', 'PREVIEW', 'STANDBY / CHUẨN BỊ', 'bg-emerald-600', 'text-white', 'input-c2-sec');
            document.getElementById('btn-c2-caugio').onclick = () => sendSignal('caster_2', 'CÂU GIỜ', 'HOLD TIME', 'bg-amber-500', 'text-slate-950', 'input-c2-sec');
            document.getElementById('btn-c2-out').onclick = () => sendSignal('caster_2', 'CASTER OUT', 'BÌNH LUẬN XONG', 'bg-blue-600', 'text-white', 'input-c2-sec');
            document.getElementById('btn-c2-break').onclick = () => sendSignal('caster_2', 'BREAK', 'NGHỈ GIẢI LAO', 'bg-purple-600', 'text-white', 'input-c2-sec');
            document.getElementById('btn-c2-sendmsg').onclick = () => sendQuickMsg('caster_2', 'input-c2-msg');
            document.getElementById('btn-c2-clearmsg').onclick = () => clearQuickMsg('caster_2');

            // Lắng nghe trạng thái để cập nhật Đèn Monitor nhỏ trên bàn đạo diễn
            listenMonitor('caster_1', 'monitor-c1');
            listenMonitor('caster_2', 'monitor-c2');
        }

        function sendSignal(targetId, titleEng, titleVie, bgClass, textClass, secInputId) {
            const countdownSec = parseInt(document.getElementById(secInputId).value) || 0;
            set(ref(db, 'signals/' + targetId), {
                titleEng: titleEng,
                titleVie: titleVie,
                bgClass: bgClass,
                textClass: textClass,
                message: '',
                countdownSec: countdownSec,
                triggerTime: Date.now()
            }).catch(err => alert("Lỗi: " + err.message));
        }

        function sendQuickMsg(targetId, inputId) {
            const input = document.getElementById(inputId);
            const msg = input.value.trim();
            if(!msg) return;

            const targetRef = ref(db, 'signals/' + targetId);
            onValue(targetRef, (snapshot) => {
                const data = snapshot.val() || {};
                set(targetRef, { ...data, message: msg });
            }, { onlyOnce: true });
            input.value = '';
        }

        function clearQuickMsg(targetId) {
            const targetRef = ref(db, 'signals/' + targetId);
            onValue(targetRef, (snapshot) => {
                const data = snapshot.val() || {};
                set(targetRef, { ...data, message: '' });
            }, { onlyOnce: true });
        }

        function listenMonitor(targetId, elementId) {
            const monitorEl = document.getElementById(elementId);
            onValue(ref(db, 'signals/' + targetId), (snapshot) => {
                const data = snapshot.val();
                if (data) {
                    monitorEl.innerText = data.titleEng + ' (' + data.titleVie + ')';
                    monitorEl.className = `px-4 py-2 rounded-xl text-xs font-black uppercase shadow ${data.bgClass} ${data.textClass}`;
                }
            });
        }

        // --- CASTER TABLET: Cập nhật trạng thái + Đếm ngược ---
        let lastTriggerTime = 0;
        let activeTimer = null;

        function initCasterTablet(targetId) {
            const bodyBg = document.getElementById('caster-view');
            const statusBadge = document.getElementById('status-badge');
            const statusSubtext = document.getElementById('status-subtext');
            const customMsg = document.getElementById('custom-msg');
            const countdownBanner = document.getElementById('caster-countdown-banner');
            const timerNum = document.getElementById('caster-timer-num');

            onValue(ref(db, 'signals/' + targetId), (snapshot) => {
                const data = snapshot.val();
                if (!data) return;

                // 1. Cập nhật ngay lập tức giao diện
                bodyBg.className = "flex-1 flex flex-col justify-center items-center p-6 text-center transition-bg " + (data.bgClass || 'bg-slate-950') + " " + (data.textClass || 'text-white');
                statusBadge.innerText = data.titleEng || 'STANDBY';
                statusSubtext.innerText = data.titleVie || 'SẴN SÀNG';

                if (data.message && data.message.trim() !== '') {
                    customMsg.innerText = `⚠️ LỜI NHẮC: ${data.message}`;
                    customMsg.classList.remove('hidden');
                } else {
                    customMsg.classList.add('hidden');
                }

                // 2. Chạy đếm ngược nếu có yêu cầu
                if (data.triggerTime && data.triggerTime !== lastTriggerTime) {
                    lastTriggerTime = data.triggerTime;

                    if (data.countdownSec && data.countdownSec > 0) {
                        if (activeTimer) clearInterval(activeTimer);
                        
                        let remainingSec = data.countdownSec;
                        countdownBanner.classList.remove('hidden');
                        timerNum.innerText = remainingSec;

                        activeTimer = setInterval(() => {
                            remainingSec--;
                            if (remainingSec > 0) {
                                timerNum.innerText = remainingSec;
                            } else {
                                clearInterval(activeTimer);
                                countdownBanner.classList.add('hidden');
                            }
                        }, 1000);
                    } else {
                        if (activeTimer) clearInterval(activeTimer);
                        countdownBanner.classList.add('hidden');
                    }
                }
            });
        }

        // --- BỘ TỰ ĐỘNG GIỮ SÁNG MÀN HÌNH (SCREEN WAKE LOCK API) ---
        let wakeLock = null;
        async function requestWakeLock() {
            const statusEl = document.getElementById('wake-lock-status');
            try {
                if ('wakeLock' in navigator) {
                    wakeLock = await navigator.wakeLock.request('screen');
                    if (statusEl) statusEl.innerText = '💡 Screen Wake Lock: ACTIVE (Màn hình luôn sáng)';
                    
                    wakeLock.addEventListener('release', () => {
                        if (statusEl) statusEl.innerText = '💡 Screen Wake Lock: Released';
                    });
                } else {
                    if (statusEl) statusEl.innerText = '⚠️ Trình duyệt không hỗ trợ Wake Lock API';
                }
            } catch (err) {
                if (statusEl) statusEl.innerText = '⚠️ Wake Lock Error: ' + err.message;
            }
        }

        document.addEventListener('visibilitychange', async () => {
            if (wakeLock !== null && document.visibilityState === 'visible') {
                await requestWakeLock();
            }
        });
    </script>
</body>
</html>
